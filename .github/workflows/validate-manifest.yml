name: Validate Prompt Library

on:
  push:
    paths:
      - 'manifest.yaml'
      - 'personas/**'
      - 'protocols/**'
      - 'formats/**'
      - 'taxonomies/**'
      - 'templates/**'
      - 'tests/validate-manifest.py'
      - 'tests/validate-instruction-fidelity.py'
      - 'tests/validate-graph-integrity.py'
      - 'cli/**'
  pull_request:
    paths:
      - 'manifest.yaml'
      - 'personas/**'
      - 'protocols/**'
      - 'formats/**'
      - 'taxonomies/**'
      - 'templates/**'
      - 'tests/validate-manifest.py'
      - 'tests/validate-instruction-fidelity.py'
      - 'tests/validate-graph-integrity.py'
      - 'cli/**'

permissions:
  contents: read

jobs:
  validate-manifest:
    name: Check manifest ↔ template protocol sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'

      - name: Validate manifest protocols
        run: python tests/validate-manifest.py

  validate-graph-integrity:
    name: Check prompt graph integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'

      - name: Validate graph integrity
        run: python tests/validate-graph-integrity.py

  validate-instruction-fidelity:
    name: Check instruction-fidelity coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'

      - name: Validate instruction-fidelity coverage
        run: python tests/validate-instruction-fidelity.py

  cli-smoke-test:
    name: CLI smoke test (launch path)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Install CLI dependencies
        run: npm ci
        working-directory: cli

      - name: Run CLI tests
        run: npm test
        working-directory: cli

      - name: Verify --dry-run smoke test (copilot)
        run: node bin/cli.js interactive --cli copilot --dry-run
        working-directory: cli

      - name: Verify --dry-run smoke test (claude)
        run: node bin/cli.js interactive --cli claude --dry-run
        working-directory: cli
